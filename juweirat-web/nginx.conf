server {
    listen 80;
    server_name juweirat.com www.juweirat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name juweirat.com www.juweirat.com;

    ssl_certificate     /etc/letsencrypt/live/juweirat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juweirat.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Static assets — served directly by Next.js with long cache
    location /_next/static/ {
        proxy_pass http://juweirat-web:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All other requests → Next.js container
    location / {
        proxy_pass         http://juweirat-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
