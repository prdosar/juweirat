services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: juweirat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       juweirat
      POSTGRES_USER:     juweirat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juweirat_dev_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - juweirat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juweirat -d juweirat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API (ASP.NET Core 10) ──────────────────────────────────────────
  juweirat-api:
    build:
      context: ./juweirat-api
      dockerfile: Dockerfile
    container_name: juweirat-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=juweirat;
        Username=juweirat;Password=${POSTGRES_PASSWORD:-juweirat_dev_2026}
      Jwt__Key:      ${JWT_SECRET:-CHANGE_ME_USE_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS}
      Jwt__Issuer:   juweirat-api
      Jwt__Audience: juweirat-clients
    volumes:
      - uploads_data:/app/uploads
    networks:
      - juweirat-net

  # ─── Public Website (Next.js) ────────────────────────────────────────────────
  juweirat-web:
    build:
      context: ./juweirat-web
      dockerfile: Dockerfile
    container_name: juweirat-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:            production
      API_URL:             http://juweirat-api:8080
      NEXT_PUBLIC_API_URL: /api
    networks:
      - juweirat-net

  # ─── Admin Panel (Next.js) ──────────────────────────────────────────────────
  juweirat-admin:
    build:
      context: ./juweirat-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_AGENT_URL: /agent
    container_name: juweirat-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - juweirat-net

  # ─── Agent conversationnel MCP (Node/TS) ────────────────────────────────────
  # Bundle juweirat-mcp + juweirat-mcp-agent dans une seule image.
  # L'agent spawn le mcp en subprocess stdio (voir Dockerfile).
  juweirat-mcp-agent:
    build:
      context: .
      dockerfile: juweirat-mcp-agent/Dockerfile
    container_name: juweirat-mcp-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3010
      # Agent : lecture/écriture des tables ChatSessions / ChatMessages / McpAuditLog
      # via le user Postgres principal (owner de ces tables).
      AGENT_PG_HOST:     postgres
      AGENT_PG_PORT:     5432
      AGENT_PG_DATABASE: juweirat
      AGENT_PG_USER:     juweirat
      AGENT_PG_PASSWORD: ${POSTGRES_PASSWORD:-juweirat_dev_2026}
      # Subprocess MCP : user Postgres READ-ONLY dédié (scripts/create_mcp_ro_user.sql).
      MCP_PG_HOST:       postgres
      MCP_PG_PORT:       5432
      MCP_PG_DATABASE:   juweirat
      MCP_PG_USER:       ${MCP_PG_USER:-juweirat_mcp_ro}
      MCP_PG_PASSWORD:   ${MCP_PG_PASSWORD:-juweirat_mcp_ro_dev_2026}
      # OpenAI + JWT (partagés avec juweirat-api pour la vérif du token admin).
      OPENAI_API_KEY:    ${OPENAI_API_KEY}
      JWT_SECRET:        ${JWT_SECRET:-CHANGE_ME_USE_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS}
      JWT_ISSUER:        juweirat-api
      JWT_AUDIENCE:      juweirat-clients
    networks:
      - juweirat-net

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────
  # Port 3002 exposé sur l'hôte → le nginx hôte proxy juweirat.com vers ici
  nginx:
    image: nginx:1.27-alpine
    container_name: juweirat-nginx
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juweirat-api
      - juweirat-web
      - juweirat-admin
      - juweirat-mcp-agent
    networks:
      - juweirat-net

volumes:
  postgres_data:
  uploads_data:

networks:
  juweirat-net:
    driver: bridge
