name: juweiratapp
description: "Application mobile Juweirat Direction pour le suivi en temps réel et en lecture seule de la Résidence Juweirat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Network & Serialization
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.6.2

  # Format & Localization
  intl: ^0.20.2

  # UI, Charts, Icons & Image Cache
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

  # Platform & Hardware
  connectivity_plus: ^6.1.0
  share_plus: ^10.1.2
  path_provider: ^2.1.5

  # Notifications & Firebase
  flutter_local_notifications: ^17.2.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
